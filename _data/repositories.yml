# Repositories shown on /repositories/, rendered as static cards (no third-party stat images).
# language picks the colour dot; topics are short labels shown as chips.
repos:
  - repo: amirata051/gsp-fourrooms
    description: From-scratch reproduction of Goal-Space Planning with Subgoal Models (JMLR 2024) on FourRooms, with an interactive report.
    language: Python
    topics: [reinforcement learning, planning, reproduction]
  - repo: amirata051/mytorch
    description: A deep learning framework built from scratch to learn how PyTorch works, with training diagnostics that name the problem.
    language: Python
    topics: [autodiff, deep learning, education]
  - repo: amirata051/kg-generator
    description: Turns PDF documents into a knowledge graph through an idempotent pipeline on FalkorDB, Kafka, MinIO and Redis.
    language: Python
    topics: [knowledge graphs, GraphRAG, Kafka]
  - repo: amirata051/DiffRUL-CMAPSS
    description: Diffusion-based data augmentation for aero-engine remaining-useful-life estimation on NASA C-MAPSS.
    language: Python
    topics: [diffusion models, time series]
  - repo: amirata051/Bearing-DiffRUL-XJTU-SY
    description: The same diffusion-based approach applied to rolling-bearing degradation on XJTU-SY.
    language: Python
    topics: [diffusion models, predictive maintenance]
  - repo: amirata051/Information-Retrieval
    description: A Persian search engine combining TF-IDF and ParsBERT retrieval, K-Means clustering and FAISS.
    language: Python
    topics: [information retrieval, NLP]
  - repo: nobletooth/dotanet
    description: A team-built ad-serving platform with real-time auctions and click and impression tracking.
    language: Go
    topics: [backend, ad tech]
  - repo: AmirmahdiTavakoli/ATS
    description: Ranks CVs against a job description using SentenceTransformers embeddings.
    language: Python
    topics: [NLP, Flask]
